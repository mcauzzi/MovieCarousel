# Header di sicurezza per tutte le risposte, errori compresi (always).
# add_header non si eredita in una location che ne dichiara di propri: per questo nginx.conf
# include questo file nel blocco server e in ogni location con un suo add_header.
# Nell'immagine: /etc/nginx/snippets/security-headers.conf (Dockerfile).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
