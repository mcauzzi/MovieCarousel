name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck e build girano dentro il Dockerfile: se falliscono non viene
      # pubblicato nulla e sul NAS resta l'immagine precedente.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mcauzzi/moviecarousel:latest
            ghcr.io/mcauzzi/moviecarousel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
