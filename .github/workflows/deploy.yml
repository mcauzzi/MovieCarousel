name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Minimo per tutti i job; packages: write solo nei job che pubblicano su GHCR (api, image).
permissions:
  contents: read

# Due immagini dallo stesso commit: l'API prima, il sito solo se l'API è stata pubblicata,
# così sul NAS non arriva un frontend più nuovo dell'API con cui parla.
# L'APK Android firmato (job android) entra nell'immagine del sito sotto /app/ insieme a
# version.json (docs/scanner-dvd.md §11.1). Senza i secret della keystore il job non produce
# nulla e il sito viene pubblicato lo stesso, senza APK (il pannello ARRIVI lo segnala).
# Komodo aggiorna lo stack quando escono le immagini nuove.
jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.check.outputs.built }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: Keystore configurata?
        id: check
        working-directory: .
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 non impostato: immagine del sito senza APK."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.built == 'true'

      - uses: actions/setup-java@v4
        if: steps.check.outputs.built == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.built == 'true'

      # Un errore qui (test, firma, build) ferma il deploy: niente immagine con un APK vecchio.
      - name: Test e APK firmato
        if: steps.check.outputs.built == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CM_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export CM_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          # La keystore decodificata sparisce anche se la build fallisce.
          trap 'rm -f "$CM_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CM_RELEASE_KEYSTORE"
          ./gradlew testReleaseUnitTest assembleRelease --console=plain

      - name: APK e version.json
        if: steps.check.outputs.built == 'true'
        env:
          # Impronta SHA-256 attesa del certificato di firma (non è un segreto: meglio una variabile).
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/android-app"
          mkdir -p "$out"
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::APK firmato non trovato (firma non configurata?)"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          # Una keystore diversa produce un APK che non si installa sopra quello esistente.
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certs" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          expected=$(printf '%s' "${ANDROID_CERT_SHA256:-}" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::warning::ANDROID_CERT_SHA256 non impostata: impronta del certificato non verificata (attuale: $actual)."
          elif [ "$actual" != "$expected" ]; then
            echo "::error::APK firmato con un certificato inatteso ($actual, atteso $expected): keystore sbagliata?"
            exit 1
          fi
          cp "$apk" "$out/cinemanager.apk"
          # Versione calcolata da Gradle (app/build.gradle.kts): una sola formula del versionCode.
          ./gradlew -q :app:printVersion --console=plain > "$RUNNER_TEMP/version.txt"
          name=$(sed -n 's/^versionName=//p' "$RUNNER_TEMP/version.txt" | tr -d '[:space:]')
          code=$(sed -n 's/^versionCode=//p' "$RUNNER_TEMP/version.txt" | tr -d '[:space:]')
          min=$(sed -n 's/^minSupportedCode=//p' "$RUNNER_TEMP/version.txt" | tr -d '[:space:]')
          test -n "$name" && test -n "$code" && test -n "$min" || { echo "::error::printVersion senza output"; exit 1; }
          test "$min" -le "$code" || { echo "::error::minSupportedCode ($min) maggiore del versionCode ($code)"; exit 1; }
          sha=$(sha256sum "$out/cinemanager.apk" | cut -d' ' -f1)
          # Stesso formato letto da AppVersionProvider (API) e da src/api.ts (sito).
          jq -n --arg version "$name" --argjson versionCode "$code" --argjson minSupportedCode "$min" \
                --arg sha256 "$sha" --arg commit "$GITHUB_SHA" \
                '{version: $version, versionCode: $versionCode, minSupportedCode: $minSupportedCode, sha256: $sha256, commit: $commit}' \
                > "$out/version.json"
          cat "$out/version.json"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.built == 'true'
        with:
          name: android-app
          path: ${{ runner.temp }}/android-app/
          if-no-files-found: error
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Test prima di pubblicare (il Dockerfile dell'API compila soltanto): se falliscono
      # non viene pubblicato nulla e sul NAS resta l'immagine precedente.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: api
        env:
          CINEMA_TEST_CONNECTION: Host=localhost;Port=5432;Username=cinema;Password=cinema
          DOTNET_NOLOGO: "true"
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"
        run: dotnet test CineManager.slnx -c Release

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/mcauzzi/moviecarousel-api:latest
            ghcr.io/mcauzzi/moviecarousel-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mcauzzi/MovieCarousel
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  image:
    needs: [api, android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Contesto "android-app" del Dockerfile: APK + version.json, oppure una cartella vuota.
      - name: Cartella dell'app
        run: mkdir -p "$RUNNER_TEMP/android-app"

      - uses: actions/download-artifact@v4
        if: needs.android.outputs.built == 'true'
        with:
          name: android-app
          path: ${{ runner.temp }}/android-app

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck e build girano dentro il Dockerfile: se falliscono non viene
      # pubblicato nulla e sul NAS resta l'immagine precedente.
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            android-app=${{ runner.temp }}/android-app
          push: true
          tags: |
            ghcr.io/mcauzzi/moviecarousel:latest
            ghcr.io/mcauzzi/moviecarousel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
