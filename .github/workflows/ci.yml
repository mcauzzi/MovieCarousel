name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

# Una sola run per branch: le push successive annullano quella in corso, e la run del pull_request
# e quella del push sullo stesso branch condividono il gruppo (head_ref nei PR, ref_name nei push:
# tutti e due sono il nome del branch): quella partita prima viene annullata, niente doppioni.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # API .NET: build e test, compresi quelli d'integrazione con un Postgres vero
  # (ogni classe di test crea e distrugge il proprio database cm_test_<guid>).
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CINEMA_TEST_CONNECTION: Host=localhost;Port=5432;Username=cinema;Password=cinema
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CineManager.slnx

      - name: Build
        run: dotnet build CineManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CineManager.slnx -c Release --no-build --logger "console;verbosity=normal"

  # Le due immagini Docker come in deploy.yml, senza push: Dockerfile, .dockerignore e configurazione
  # di nginx vengono provati prima del merge su master.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Contesto "android-app" del Dockerfile vuoto: immagine senza APK, come senza keystore
      - name: Cartella dell'app (vuota)
        run: mkdir -p "$RUNNER_TEMP/android-app"

      - name: Immagine del sito
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            android-app=${{ runner.temp }}/android-app
          push: false
          load: true
          tags: moviecarousel:ci
          cache-from: type=gha

      - name: nginx -t nell'immagine del sito
        run: docker run --rm moviecarousel:ci nginx -t

      - name: Immagine dell'API
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
