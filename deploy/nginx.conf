# Due root sovrapposte:
#   /usr/share/nginx/html  bundle dell'immagine (index.html, assets/*.js|css, assets/fonts/)
#   /srv/data              cartella del NAS, sola lettura (config.json, assets/<collezione>.tc,
#                          assets/covers/, assets/bgm/)
# Vince sempre l'immagine; tutto ciò che non c'è viene cercato nei dati.
# Eventuali index.html e bundle vecchi rimasti nella cartella del NAS vengono ignorati.
#
# /api/ va all'API (servizio "api" dello stack, docs/scanner-dvd.md §12), tranne /api/app/version
# che è un file statico dell'immagine. /app/ (APK + version.json, fase 5) viene solo dall'immagine.

# Questo file è incluso da conf.d/ dentro il blocco http: map va a questo livello.
# Cache-Control delle risposte dell'API: quello scelto dall'API se c'è, altrimenti no-store.
map $upstream_http_cache_control $api_cache_control {
    ""      "no-store";
    default $upstream_http_cache_control;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    # DNS di Docker. "api" viene risolto a ogni richiesta (proxy_pass con variabile): nginx parte
    # anche se l'API non è ancora su, e segue il nuovo IP quando il container viene ricreato.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # index.html sempre rivalidato: version-check.ts confronta il bundle con quello del server
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Bundle e font hashati: immutabili. Se non sono nell'immagine si passa ai dati.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @data;
    }
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # bgm.ts scopre le tracce leggendo il listing della cartella (fallback: tracks.json)
    location /assets/bgm/ {
        root /srv/data;
        autoindex on;
    }

    # API. Con una variabile e senza URI in proxy_pass la richiesta originale (percorso e query)
    # passa invariata: /api/x?y=1 → http://api:8080/api/x?y=1.
    # Si inoltra solo X-Forwarded-For (per l'IP reale, §4.1): niente X-Forwarded-Proto/Host,
    # il redirect_uri OIDC viene da PublicBaseUrl.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $api_cache_control always;
    }

    # Import da Tellico: corpi grandi (XML, immagini in base64) e tempi lunghi
    location ~ ^/api/import/tellico(/images)?$ {
        client_max_body_size 32m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $api_cache_control always;
    }

    # Versione dell'app: file statico dell'immagine, sotto /api/app/ perché Caddy non mette il
    # forward auth davanti a /api/app/* (§11.1, §12). Senza APK nell'immagine → 404.
    location = /api/app/version {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        alias /usr/share/nginx/html/app/version.json;
    }

    # APK e version.json inclusi nell'immagine (§11.1): mai ripiegare sui dati del NAS
    location /app/ {
        types {
            application/vnd.android.package-archive apk;
            application/json                        json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri @data;
    }

    location @data {
        root /srv/data;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
