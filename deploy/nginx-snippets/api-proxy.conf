# Inoltro all'API, comune alle location /api/ di nginx.conf.
# Nell'immagine: /etc/nginx/snippets/api-proxy.conf (Dockerfile).
#
# Con una variabile e senza URI in proxy_pass la richiesta originale (percorso e query) passa
# invariata: /api/x?y=1 → http://api:8080/api/x?y=1. "api" viene risolto a ogni richiesta.
# Si inoltra solo X-Forwarded-For (per l'IP reale, §4.1): niente X-Forwarded-Proto/Host,
# il redirect_uri OIDC viene da PublicBaseUrl.
set $api http://api:8080;
proxy_pass $api;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# Cache-Control: quello dell'API se c'è, altrimenti no-store (map in nginx.conf).
# Gli header di sicurezza li mette nginx: quelli eventuali dell'API vengono tolti per non duplicarli.
proxy_hide_header Cache-Control;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Content-Security-Policy;
add_header Cache-Control $api_cache_control always;
include /etc/nginx/snippets/security-headers.conf;

# Errori generati da nginx (corpo troppo grande, API giù o lenta): problem+json come quelli
# dell'API invece della pagina HTML. Le risposte d'errore dell'API passano invariate
# (proxy_intercept_errors è off).
error_page 413 @api_413;
error_page 502 @api_502;
error_page 503 @api_503;
error_page 504 @api_504;
